services:
  - type: web
    runtime: node
    name: vendor-management-system
    buildCommand: npm install && npm run deploy:build
    preDeployCommand: npm run deploy:migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: BCRYPT_SALT_ROUNDS
        value: 10
      - key: DATABASE_URL
        fromDatabase:
          name: vendor-management-db
          property: connectionString

databases:
  - name: vendor-management-db
    databaseName: vendor_management
    user: vendor_admin
